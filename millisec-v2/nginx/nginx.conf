events {
    worker_connections 1024;
}

http {
    # Logging
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"host":"$host"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Security
    server_tokens off;
    client_max_body_size 10m;

    # Upstreams
    upstream frontend_external {
        server frontend-external:80;
    }
    upstream frontend_intranet {
        server frontend-intranet:80;
    }
    upstream backend {
        server backend:3000;
    }

    # ── EXTERNAL SITE — millisec.live ──
    server {
        listen 80;
        server_name millisec.live www.millisec.live;

        # API
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
        }

        # Frontend
        location / {
            proxy_pass         http://frontend_external;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }

    # ── INTRANET — intranet.millisec.live ──
    server {
        listen 80;
        server_name intranet.millisec.live;

        # VPN subnet — yalnız bu IP-lərdən giriş
        # WireGuard qurulduqdan sonra 10.8.0.0/24 əlavə et
        allow 127.0.0.1;
        allow 10.8.0.0/24;
        deny all;

        # API
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # Intranet Frontend
        location / {
            proxy_pass         http://frontend_intranet;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }

    # ── DEFAULT — IP ilə giriş üçün (test məqsədli) ──
    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location / {
            proxy_pass         http://frontend_external;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }
}
